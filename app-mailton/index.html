<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Trava de zoom automático para iOS -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Mailton Maia - Agendamento Premium</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Importação do CSS externo -->
    <link rel="stylesheet" href="css/style.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        brand: { 400: '#FCD34D', 500: '#F59E0B', 600: '#D97706' },
                        surface: '#18181b', // Zinco escuro premium
                        surfaceHover: '#27272a'
                    }
                }
            }
        }
    </script>
</head>
<body class="text-gray-200 font-sans antialiased relative selection:bg-brand-500 selection:text-black">

    <div class="max-w-md mx-auto min-h-screen relative shadow-2xl border-x border-white/5 pb-12 overflow-hidden">
        
        <!-- Efeito de Luz Dourada de Fundo -->
        <div class="glow-bg"></div>
        
        <!-- HEADER PREMIUM -->
        <header class="pt-12 pb-8 px-6 text-center relative z-10">
            <div class="relative inline-block">
                <!-- Anel de gradiente ao redor da foto -->
                <div class="absolute inset-0 bg-gradient-to-tr from-brand-600 to-brand-400 rounded-full blur p-1"></div>
                <img src="img/perfil.jpg" alt="Mailton Maia" class="relative w-28 h-28 mx-auto rounded-full border-4 border-[#09090b] object-cover" onerror="this.src='https://ui-avatars.com/api/?name=Mailton+Maia&background=F59E0B&color=09090b'">
            </div>
            
            <h1 class="text-3xl font-bold text-white mt-4 tracking-tight">Mailton Maia</h1>
            <p class="text-brand-400 text-xs font-bold uppercase tracking-[0.2em] mt-2 opacity-90">Sobrancelhas & Micropigmentação</p>
            <div class="inline-flex items-center gap-2 mt-3 bg-white/5 backdrop-blur-sm px-4 py-1.5 rounded-full border border-white/5">
                <i class="fa-solid fa-location-dot text-brand-500 text-xs"></i>
                <span class="text-gray-400 text-xs font-medium">Várzea Nova / Santa Rita</span>
            </div>
        </header>

        <!-- SERVIÇOS -->
        <main class="px-5 py-2 relative z-10">
            <div class="flex items-center justify-between mb-5 px-1">
                <h2 class="text-lg font-semibold text-white">Nossos Serviços</h2>
            </div>
            
            <div class="space-y-4">
                <!-- Card 1 -->
                <div class="group bg-surface/50 backdrop-blur-md rounded-3xl p-5 border border-white/10 hover:border-brand-500/50 hover:bg-surface transition-all duration-300 cursor-pointer shadow-lg" onclick="abrirModal(1, 'Design de Sobrancelha', 'R$ 35,00', '30 min')">
                    <div class="flex justify-between items-center">
                        <div>
                            <h3 class="font-bold text-white text-base group-hover:text-brand-400 transition-colors">Design de Sobrancelha</h3>
                            <div class="flex items-center gap-3 mt-2">
                                <span class="bg-white/5 text-gray-300 text-[11px] px-2.5 py-1 rounded-md font-medium flex items-center gap-1">
                                    <i class="fa-regular fa-clock text-brand-500"></i> 30 min
                                </span>
                            </div>
                        </div>
                        <div class="text-right flex flex-col items-end">
                            <p class="text-white font-bold text-lg">R$ 35</p>
                            <button class="mt-2 text-brand-500 text-sm font-semibold flex items-center gap-1 group-hover:translate-x-1 transition-transform">
                                Agendar <i class="fa-solid fa-chevron-right text-[10px]"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Card 2 -->
                <div class="group bg-surface/50 backdrop-blur-md rounded-3xl p-5 border border-white/10 hover:border-brand-500/50 hover:bg-surface transition-all duration-300 cursor-pointer shadow-lg" onclick="abrirModal(2, 'Micropigmentação', 'R$ 250,00', '1h 30 min')">
                    <div class="flex justify-between items-center">
                        <div>
                            <h3 class="font-bold text-white text-base group-hover:text-brand-400 transition-colors">Micropigmentação</h3>
                            <div class="flex items-center gap-3 mt-2">
                                <span class="bg-white/5 text-gray-300 text-[11px] px-2.5 py-1 rounded-md font-medium flex items-center gap-1">
                                    <i class="fa-regular fa-clock text-brand-500"></i> 1h 30m
                                </span>
                            </div>
                        </div>
                        <div class="text-right flex flex-col items-end">
                            <p class="text-white font-bold text-lg">R$ 250</p>
                            <button class="mt-2 text-brand-500 text-sm font-semibold flex items-center gap-1 group-hover:translate-x-1 transition-transform">
                                Agendar <i class="fa-solid fa-chevron-right text-[10px]"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Card 3 -->
                <div class="group bg-surface/50 backdrop-blur-md rounded-3xl p-5 border border-white/10 hover:border-brand-500/50 hover:bg-surface transition-all duration-300 cursor-pointer shadow-lg" onclick="abrirModal(3, 'Retoque / Manutenção', 'R$ 100,00', '45 min')">
                    <div class="flex justify-between items-center">
                        <div>
                            <h3 class="font-bold text-white text-base group-hover:text-brand-400 transition-colors">Retoque (Manutenção)</h3>
                            <div class="flex items-center gap-3 mt-2">
                                <span class="bg-white/5 text-gray-300 text-[11px] px-2.5 py-1 rounded-md font-medium flex items-center gap-1">
                                    <i class="fa-regular fa-clock text-brand-500"></i> 45 min
                                </span>
                            </div>
                        </div>
                        <div class="text-right flex flex-col items-end">
                            <p class="text-white font-bold text-lg">R$ 100</p>
                            <button class="mt-2 text-brand-500 text-sm font-semibold flex items-center gap-1 group-hover:translate-x-1 transition-transform">
                                Agendar <i class="fa-solid fa-chevron-right text-[10px]"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- MODAL DE AGENDAMENTO -->
        <div id="modalHorario" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex flex-col justify-end transition-opacity">
            <!-- Área de clique para fechar -->
            <div class="flex-1 w-full" onclick="fecharModal()"></div>
            
            <div class="bg-surface w-full max-w-md mx-auto rounded-t-[32px] p-6 modal-enter border-t border-white/10 max-h-[92vh] overflow-y-auto hide-scroll shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
                <!-- Pill indicator -->
                <div class="w-12 h-1.5 bg-white/20 rounded-full mx-auto mb-6"></div>
                
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <h3 class="text-xl font-bold text-white tracking-tight" id="modalServicoNome">Serviço</h3>
                        <p class="text-brand-500 text-sm font-semibold mt-1" id="modalServicoInfo">Valor e Duração</p>
                    </div>
                    <button onclick="fecharModal()" class="text-gray-400 hover:text-white bg-white/5 hover:bg-white/10 w-8 h-8 rounded-full flex items-center justify-center transition-colors">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <!-- Inputs do Cliente (Corrigidos para text-base) -->
                <div class="space-y-4 mb-8">
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fa-regular fa-user text-gray-500"></i>
                        </div>
                        <input type="text" id="clienteNome" placeholder="Seu Nome Completo" class="w-full bg-[#09090b] border border-white/10 rounded-2xl pl-11 pr-4 py-3.5 text-base text-white focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all placeholder:text-gray-600">
                    </div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fa-brands fa-whatsapp text-gray-500"></i>
                        </div>
                        <input type="tel" id="clienteTelefone" placeholder="Seu WhatsApp (com DDD)" class="w-full bg-[#09090b] border border-white/10 rounded-2xl pl-11 pr-4 py-3.5 text-base text-white focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all placeholder:text-gray-600">
                    </div>
                </div>

                <!-- Carrossel de Datas -->
                <div class="mb-8">
                    <div class="flex justify-between items-end mb-3 px-1">
                        <label class="block text-sm font-semibold text-white">Escolha a Data</label>
                        <span id="mesAtualLabel" class="text-xs text-brand-500 font-bold uppercase tracking-wider"></span>
                    </div>
                    <div id="carrosselDatas" class="flex space-x-3 overflow-x-auto pb-2 hide-scroll snap-x">
                        <!-- Gerado via JS -->
                    </div>
                </div>

                <!-- Horários -->
                <div class="mb-8">
                    <label class="block text-sm font-semibold text-white mb-3 px-1">Horários Disponíveis</label>
                    <div class="grid grid-cols-3 gap-3" id="gridHorarios">
                        <p class="text-sm text-gray-500 col-span-3 text-center py-6 bg-[#09090b] rounded-2xl border border-white/5 border-dashed">
                            Selecione uma data acima para ver os horários.
                        </p>
                    </div>
                </div>

                <button id="btnConfirmar" onclick="enviarAgendamento()" class="w-full bg-gradient-to-r from-brand-500 to-brand-400 text-black font-bold text-base py-4 rounded-2xl shadow-[0_0_20px_rgba(245,158,11,0.3)] active:scale-[0.98] transition-all flex justify-center items-center gap-2">
                    Confirmar Agendamento
                </button>
            </div>
        </div>
    </div>

    <!-- Script Importado -->
    <script src="js/app.js"></script>
</body>
</html>
