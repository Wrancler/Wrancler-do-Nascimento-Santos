<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Painel Admin - Mailton Maia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { brand: { 400: '#FCD34D', 500: '#F59E0B', 600: '#D97706' }, surface: '#18181b' }
                }
            }
        }
    </script>
</head>
<body class="bg-[#09090b] text-gray-200 font-sans antialiased pb-12">

    <div class="max-w-md mx-auto min-h-screen relative shadow-2xl border-x border-white/5">
        
        <!-- HEADER ADMIN -->
        <header class="pt-10 pb-6 px-6 bg-surface border-b border-white/10 sticky top-0 z-50">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-xl font-bold text-white">Painel de Gestão</h1>
                    <p class="text-brand-500 text-xs font-bold uppercase tracking-widest mt-1">Mailton Maia</p>
                </div>
                <div class="w-10 h-10 rounded-full bg-brand-500/20 flex items-center justify-center text-brand-500 border border-brand-500/30">
                    <i class="fa-solid fa-chart-pie"></i>
                </div>
            </div>
        </header>

        <main class="px-5 py-6 space-y-6">
            <!-- CARTÃO DE RECEITA -->
            <div class="bg-gradient-to-br from-brand-600 to-brand-400 rounded-3xl p-6 shadow-[0_10px_30px_rgba(245,158,11,0.2)] text-black relative overflow-hidden">
                <i class="fa-solid fa-wallet absolute -right-4 -bottom-4 text-7xl text-black/10"></i>
                <p class="text-sm font-bold uppercase tracking-wider opacity-80 mb-1">Faturamento Previsto</p>
                <h2 class="text-4xl font-black tracking-tight" id="faturamentoTotal">R$ 0,00</h2>
            </div>

            <!-- GESTÃO DE MESES -->
            <div>
                <h3 class="text-lg font-semibold text-white mb-3">Liberar Agendamentos</h3>
                <div class="bg-surface rounded-3xl p-5 border border-white/10" id="containerMeses">
                    <p class="text-xs text-gray-500 text-center"><i class="fa-solid fa-spinner fa-spin mr-2"></i>A carregar meses...</p>
                </div>
            </div>

            <!-- LISTA DE AGENDAMENTOS -->
            <div>
                <h3 class="text-lg font-semibold text-white mb-3">Últimos Agendamentos</h3>
                <div class="space-y-3" id="listaAgendamentos">
                    <p class="text-xs text-gray-500 text-center py-4"><i class="fa-solid fa-spinner fa-spin mr-2"></i>A buscar dados...</p>
                </div>
            </div>
        </main>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
